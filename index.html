<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8fc">
<title>FormWheel Balance</title>

<link rel="stylesheet" href="./assets/styles.css">
<link rel="stylesheet" href="https://semicolonxss.github.io/Formwheel/shared/formwheel-ui.css">
<script defer src="https://semicolonxss.github.io/Formwheel/shared/formwheel-ui.js"></script>
<meta property="og:title" content="Balance · Formwheel">
<meta property="og:description" content="공격, 방어, 점수 등 선택을 이용해 균형을 겨루는 게임.">
<meta property="og:image" content="https://semicolonxss.github.io/Formwheel_Balance/assets/thumbnail.svg">
<link rel="stylesheet" href="assets/formwheel-brand.css?v=20261008-hub-logo">
<link rel="icon" type="image/svg+xml" href="https://semicolonxss.github.io/Formwheel/assets/formwheel-favicon.svg">
</head>

<body>

<header class="header">
  <a class="logo fw-hub-logo" href="https://semicolonxss.github.io/Formwheel/" aria-label="FormWheel 메인으로 이동"><span class="fw-hub-form">Form</span><span class="fw-hub-icon" aria-hidden="true"></span><span class="fw-hub-wheel">Wheel</span></a>

  <div class="headerRight">⚖️ Balance</div>
</header>

<main class="wrap">

  <section class="hero">
    <h1>⚖️ Balance</h1>
    <p>욕심과 안전 사이에서 균형을 잡아라.</p>
  </section>

  <!-- SETUP -->
  <section id="setup" class="card setup">

    <div class="sectionTitle">게임 시작</div>

    <input
      id="nickname"
      maxlength="12"
      placeholder="닉네임을 입력하세요 (최대 12자)"
    >

    <div class="row">
      <button class="btn btnPrimary" id="createBtn">
        방 만들기
      </button>

      <button class="btn btnLight" id="joinBtn">
        방 참가
      </button>
    </div>

    <div id="joinArea" style="display:none;margin-top:12px">
      <input id="roomInput" maxlength="4" placeholder="4자리 방 코드">
      <button
        class="btn btnPrimary"
        id="joinConfirm"
        style="width:100%;margin-top:10px"
      >
        참가하기
      </button>
    </div>

    <div id="roomInfo" class="roomInfo">
      <div style="font-size:12px;color:#858893;font-weight:800">
        ROOM CODE
      </div>

      <div id="roomCode" class="roomCode">----</div>

      <button
        class="btn btnLight"
        id="copyBtn"
        style="width:100%"
      >
        방 코드 복사
      </button>

      <div class="players" id="players"></div>

      <button
        class="btn btnPrimary"
        id="startBtn"
        style="width:100%;margin-top:15px;display:none"
      >
        게임 시작
      </button>

      <div class="note">
        최소 2명부터 시작할 수 있습니다.<br>
        호스트만 게임을 시작할 수 있습니다.
      </div>
    </div>

  </section>

  <!-- GAME -->
  <section id="game" class="game">

    <div class="topStats">
      <div class="card stat">
        <div class="statLabel">현재 라운드</div>
        <div class="statValue" id="roundDisplay">1 / 10</div>
      </div>

      <div class="card stat">
        <div class="statLabel">내 점수</div>
        <div class="statValue" id="myScore">0</div>
      </div>
    </div>

    <div class="roundText" id="roundStatus">
      행동을 선택하세요
    </div>

    <div class="card myCard">

      <div class="myHead">
        <div class="myName" id="myName">Player</div>
        <div class="score" id="bigScore">0</div>
      </div>

      <div class="riskLabel">
        <span>⚠️ 위험도</span>
        <span id="riskText">0 / 100</span>
      </div>

      <div class="riskBar">
        <div id="riskFill" class="riskFill"></div>
      </div>

      <div class="riskNumbers">
        <span>안전</span>
        <span>불안정</span>
        <span>위험</span>
      </div>

      <div class="actions">

        <button class="action" data-action="attack">
          <span class="actionIcon">⚔️</span>
          공격
          <span class="actionSmall">상대에게 피해</span>
        </button>

        <button class="action" data-action="defend">
          <span class="actionIcon">🛡️</span>
          방어
          <span class="actionSmall">위험도 감소</span>
        </button>

        <button class="action" data-action="greed">
          <span class="actionIcon">💰</span>
          점수 획득
          <span class="actionSmall">큰 점수 / 큰 위험</span>
        </button>

        <button class="action" data-action="swap">
          <span class="actionIcon">🔄</span>
          교환
          <span class="actionSmall">상대와 점수 교환</span>
        </button>

        <button class="action" data-action="random">
          <span class="actionIcon">🎲</span>
          랜덤
          <span class="actionSmall">예측 불가능</span>
        </button>

      </div>

      <div class="waiting" id="waiting">
        행동을 선택하면 기다립니다.
      </div>

    </div>

    <div class="allPlayers" id="allPlayers"></div>

  </section>

</main>


<!-- EVENT MODAL -->
<div class="modal" id="eventModal">
  <div class="modalBox">

    <div class="eventIcon" id="eventIcon">⚡</div>

    <div class="eventTitle" id="eventTitle">
      균형 붕괴!
    </div>

    <div class="eventText" id="eventText">
      특별한 사건이 발생했습니다.
    </div>

    <button
      class="btn btnPrimary"
      id="eventClose"
      style="width:100%;margin-top:20px"
    >
      확인
    </button>

  </div>
</div>


<!-- RESULT MODAL -->
<div class="modal" id="resultModal">
  <div class="modalBox">

    <div class="eventIcon">🏆</div>

    <div class="eventTitle">
      Balance 종료
    </div>

    <div class="eventText">
      최종 결과
    </div>

    <div class="resultList" id="resultList"></div>

    <button
      class="btn btnPrimary"
      id="backHome"
      style="width:100%"
    >
      메인으로
    </button>

  </div>
</div>


<script type="module" src="./assets/app.js"></script>

</body>
</html>
